[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayestraj-repro"
version = "1.0.0"
description = "Compact reproducibility code for the BayesTraj Aug. 21 submission"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

